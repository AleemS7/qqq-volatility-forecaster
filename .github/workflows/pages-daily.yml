name: pages-daily

on:
  workflow_run:
    workflows: [brief-daily]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CATALOG: qqq_volatility_forecaster_pr
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -e .
      - uses: databricks/setup-cli@main
      - name: Download gold exports
        run: |
          mkdir -p data/gold
          for name in daily_metrics daily_brief backtest_predictions; do
            databricks fs cp "dbfs:/Volumes/$CATALOG/gold/exports/$name.csv" "data/gold/$name.csv"
          done
      - run: qqq-volatility-forecaster site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
