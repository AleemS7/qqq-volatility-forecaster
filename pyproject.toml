[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq-volatility-forecaster"
version = "0.1.0"
description = "QQQ realized volatility forecaster compared against VXN"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
qqq-volatility-forecaster = "qqq_volatility_forecaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
