name: ci-weekly

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: pytest --cov=qqq_volatility_forecaster --cov-fail-under=80
      - run: pip-audit -r requirements.txt
